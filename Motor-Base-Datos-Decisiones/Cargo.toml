[package]
name = "tempus-ddb"
version = "0.2.1"
description = "Free, local-first, tamper-evident decision ledger for AI agents"
license = "MIT"
repository = "https://github.com/JPatronC92/tempus-ddb"
authors = ["Tempus DDB Contributors"]
readme = "README.md"
keywords = ["ai", "agents", "ledger", "audit", "mcp"]
categories = ["command-line-utilities", "database"]
edition = "2021"

[lib]
name = "_tempus_ddb"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
clap = { version = "4.4", features = ["derive"] }
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = { version = "0.22.2", features = ["extension-module", "abi3-py38"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.89"

[dev-dependencies]
tempfile = "3.8"
