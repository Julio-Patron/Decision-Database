[package]
name = "motor_sincronizacion_onchain"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Add stubs for the missing deps mentioned in the audit
aws-sdk-dynamodb = "1.0"
aws-sdk-secretsmanager = "1.0"
aws-config = "1.0"
alloy-primitives = "0.7"
alloy = { version = "0.1", features = ["reqwest", "signers", "sol-types", "providers", "network", "transport-http", "signer-local", "rpc", "rpc-types-eth", "contract"] }
thiserror = "1.0"
core-ledger = { path = "../Motor-Base-Datos-Decisiones" }
