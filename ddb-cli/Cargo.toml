[package]
name = "ddb-cli"
version = "0.1.0"
description = "Decision Database unified CLI"
edition = "2021"

[[bin]]
name = "ddb"
path = "src/main.rs"

[dependencies]
ddb-sdk = { path = "../ddb-sdk" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
tokio = { version = "1.0", features = ["full"] }
alloy-primitives = "0.7"
rusqlite = "0.31"
sha2 = "0.10"
alloy = { version = "0.1", features = ["reqwest", "signers", "sol-types", "providers", "network", "transport-http", "signer-local", "rpc", "rpc-types-eth", "contract"] }
